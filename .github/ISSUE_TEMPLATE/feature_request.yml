name: Feature request
description: Suggest a focused improvement to ProfileBar.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow, not just a proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how you think ProfileBar should help.
